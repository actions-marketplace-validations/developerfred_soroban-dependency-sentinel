name: Sentinel scan

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: developerfred/soroban-dependency-sentinel@v1
        with:
          fail-on: high
          upload-sarif: "true"
